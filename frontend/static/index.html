<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossWordFalcon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header id="page-header">
      <img src="logo.svg" alt="CrossWordFalcon" id="logo">
      <h1 data-i18n="pageTitle">CrossWordFalcon — générateur de grilles de mots croisés</h1>
      <span id="version-badge" class="badge" hidden></span>
      <span id="info-badge" class="info-badge" hidden tabindex="0" role="button" data-i18n-aria="infoBadgeLabel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <line x1="12" y1="11" x2="12" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <circle cx="12" cy="7.5" r="1.25" fill="currentColor"></circle>
        </svg>
        <div id="info-tooltip" class="info-tooltip" role="tooltip"></div>
      </span>
    </header>

    <form id="generate-form">
      <label for="language">
        <span data-i18n="languageLabel">Langue</span>
        <select id="language" name="language">
          <option value="fr" selected>Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
        </select>
      </label>

      <label for="width">
        <span data-i18n="widthLabel">Largeur</span>
        <input type="number" id="width" name="width" min="5" step="1" value="15" required>
      </label>

      <label for="height">
        <span data-i18n="heightLabel">Hauteur</span>
        <input type="number" id="height" name="height" min="5" step="1" value="10" required>
      </label>

      <label for="difficulty">
        <span data-i18n="difficultyLabel">Difficulté</span>
        <select id="difficulty" name="difficulty">
          <option value="easy" selected data-i18n="difficultyEasy">Facile</option>
          <option value="medium" data-i18n="difficultyMedium">Moyenne</option>
          <option value="hard" data-i18n="difficultyHard">Difficile</option>
        </select>
      </label>

      <label for="black-enrichment">
        <span data-i18n="blackEnrichmentLabel">Taux noir</span>
        <span class="input-with-suffix">
          <input type="number" id="black-enrichment" name="black_enrichment_percent"
                 min="0" max="100" step="1" value="17">
          <span class="input-suffix">%</span>
        </span>
      </label>

      <label for="force-letters">
        <span data-i18n="forceLettersLabel">Graines</span>
        <span class="input-with-suffix">
          <input type="number" id="force-letters" name="force_letters_percent"
                 min="0" max="100" step="1" value="1">
          <span class="input-suffix">%</span>
        </span>
      </label>

      <label for="mode">
        <span data-i18n="modeLabel">Mode</span>
        <select id="mode" name="mode">
          <option value="flash" data-i18n="modeFlash">Flash</option>
          <option value="turbo" data-i18n="modeTurbo">Turbo</option>
          <option value="fast" data-i18n="modeFast">Rapide</option>
          <option value="medium" selected data-i18n="modeMedium">Moyen</option>
          <option value="ultra" data-i18n="modeUltra">Ultra</option>
        </select>
      </label>

      <button type="submit" id="generate-btn" data-i18n="generateBtn">Générer la grille</button>
      <button type="button" id="attempt-preview-reveal-btn" class="toggle-btn"
              data-i18n="attemptPreviewRevealBtn">Voir</button>
      <button type="button" id="stop-btn" data-i18n="stopBtn" hidden>Stop</button>
      <button type="button" id="continue-btn" data-i18n="continueBtn" hidden>Continuer</button>
      <button type="button" id="check-btn" class="toggle-btn" data-i18n="checkBtn" hidden>Vérification</button>
      <button type="button" id="solution-btn" class="toggle-btn" data-i18n="solutionBtn" hidden>Solution</button>
      <button type="button" id="definitions-btn" class="toggle-btn" data-i18n="definitionsBtn" hidden>Définitions</button>
      <button type="button" id="library-btn" data-i18n="libraryBtn">Bibliothèque</button>
    </form>

    <p id="status" role="status"></p>

    <section id="library" hidden>
      <div id="library-header">
        <p id="library-label" data-i18n="libraryLabel"></p>
        <button type="button" id="library-close-btn" class="nav-btn"
                data-i18n-aria="libraryCloseBtn">✕</button>
      </div>
      <div class="table-scroll">
        <table id="library-table">
          <thead>
            <tr>
              <th data-i18n="libraryColLanguage"></th>
              <th data-i18n="libraryColDate"></th>
              <th data-i18n="libraryColTitle"></th>
              <th data-i18n="libraryColDifficulty"></th>
              <th data-i18n="libraryColSize"></th>
            </tr>
          </thead>
          <tbody id="library-tbody"></tbody>
        </table>
      </div>
      <p id="library-empty" data-i18n="libraryEmpty" hidden></p>
    </section>

    <section id="attempt-preview" hidden>
      <div id="attempt-preview-header">
        <p id="attempt-preview-label" data-i18n="attemptPreviewLabel"></p>
        <button type="button" id="attempt-preview-first-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewFirstBtn" disabled>⏮</button>
        <button type="button" id="attempt-preview-prev-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewPrevBtn" disabled>◀</button>
        <span id="attempt-preview-position"></span>
        <button type="button" id="attempt-preview-next-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewNextBtn" disabled>▶</button>
        <button type="button" id="attempt-preview-last-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewLastBtn" disabled>⏭</button>
      </div>
      <p id="attempt-preview-status"></p>
      <div id="attempt-preview-grids"></div>
      <div id="word-verification-wrap" hidden>
        <p id="word-verification-title" data-i18n="wordVerificationTitle"></p>
        <div class="table-scroll">
          <table id="word-verification-table">
            <thead>
              <tr>
                <th data-i18n="wordVerificationColPosition"></th>
                <th data-i18n="wordVerificationColWordlist"></th>
                <th data-i18n="wordVerificationColRoot"></th>
              </tr>
            </thead>
            <tbody id="word-verification-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="result" hidden>
      <h2 id="grid-title" hidden></h2>
      <p id="stats"></p>
      <p id="generation-times">
        <span id="generation-times-text"></span>
        <button type="button" id="generation-times-prev-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewPrevBtn" disabled>◀</button>
        <span id="generation-times-position"></span>
        <button type="button" id="generation-times-next-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewNextBtn" disabled>▶</button>
      </p>
      <div id="board">
        <div id="clues">
          <h2 data-i18n="acrossHeading">Horizontalement</h2>
          <div id="clues-across" class="clue-lines"></div>
        </div>
        <div id="grid-column">
          <div id="grid"></div>
          <p id="hover-definition"></p>
        </div>
      </div>
      <div id="down-clues-section">
        <h2 data-i18n="downHeading">Verticalement</h2>
        <div id="clues-down" class="clue-lines clue-lines-columns"></div>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
