<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrossWordFalcon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header id="page-header">
      <img src="logo.svg" alt="CrossWordFalcon" id="logo">
      <h1 data-i18n="pageTitle">CrossWordFalcon — générateur de grilles de mots croisés</h1>
      <!-- Pseudo de l'utilisateur, centré entre le titre et les
           boutons/icônes à droite (deux `margin-right: auto` sur le
           header, un sur h1 un ici, qui se partagent l'espace libre) —
           à la demande explicite de l'utilisateur. Un clic rouvre le
           panneau d'accueil (#welcome-overlay) pour changer pseudo/langue.
           Affiché après acceptation ; montre un libellé "définir un
           pseudo" traduit tant qu'aucun pseudo n'est saisi. -->
      <button type="button" id="user-pseudo" data-i18n-aria="userPseudoLabel"
              data-i18n-title="userPseudoLabel" hidden></button>
      <!-- Compteur "x en ligne" — nombre d'utilisateurs actifs distincts
           (dédoublonnés par pseudo), rafraîchi toutes les 2s via
           POST /api/presence. À gauche du badge de version, à la demande
           explicite de l'utilisateur. Caché jusqu'au premier battement
           de cœur réussi. -->
      <span id="online-count" class="badge" hidden></span>
      <span id="version-badge" class="badge" hidden></span>
      <span id="info-badge" class="info-badge" hidden tabindex="0" role="button" data-i18n-aria="infoBadgeLabel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <line x1="12" y1="11" x2="12" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <circle cx="12" cy="7.5" r="1.25" fill="currentColor"></circle>
        </svg>
        <div id="info-tooltip" class="info-tooltip" role="tooltip"></div>
      </span>
      <a id="discussions-link" href="https://github.com/EtienneAb3d/CrossWordFalcon/discussions"
         target="_blank" rel="noopener noreferrer"
         data-i18n-aria="discussionsLinkLabel" data-i18n-title="discussionsLinkLabel">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h8.5a.25.25 0 01.25.25v5.5a.25.25 0 01-.25.25h-3.5a.75.75 0 00-.53.22L3.5 11.44V9.25a.75.75 0 00-.75-.75h-1a.25.25 0 01-.25-.25v-5.5zM1.75 1A1.75 1.75 0 000 2.75v5.5C0 9.216.784 10 1.75 10H2v1.543a1.457 1.457 0 002.487 1.03L7.061 10h3.189A1.75 1.75 0 0012 8.25v-5.5A1.75 1.75 0 0010.25 1h-8.5zM14.5 4.75a.25.25 0 00-.25-.25h-.5a.75.75 0 110-1.5h.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0114.5 12H14v1.543a1.457 1.457 0 01-2.487 1.03L9.22 12.28a.75.75 0 111.06-1.06l2.22 2.22v-2.19a.75.75 0 01.75-.75h1a.25.25 0 00.25-.25v-5.5z"></path>
        </svg>
      </a>
      <a id="github-link" href="https://github.com/EtienneAb3d/CrossWordFalcon"
         target="_blank" rel="noopener noreferrer"
         data-i18n-aria="githubLinkLabel" data-i18n-title="githubLinkLabel">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
      </a>
    </header>

    <form id="generate-form">
      <label for="language">
        <span data-i18n="languageLabel">Langue</span>
        <select id="language" name="language">
          <option value="fr" selected>Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
        </select>
      </label>

      <label for="width">
        <span data-i18n="widthLabel">Largeur</span>
        <input type="number" id="width" name="width" min="5" max="30" step="1" value="15" required>
      </label>

      <!-- Grille bilingue, à la demande explicite de l'utilisateur : "entre
           les configuration Largeur et Hauteur, ajouter un second sélecteur
           de langue 'Bilingue'." Mêmes options que #language ci-dessus —
           script.js force ce sélecteur à la même valeur que #language à
           chaque changement de celui-ci (donc "fr" au chargement, comme
           #language), le joueur peut ensuite le régler sur une langue
           différente pour une vraie grille bilingue (mots verticaux dans
           cette seconde langue, voir crossword_gen.generate_grid). -->
      <label for="bilingual-language">
        <span data-i18n="bilingualLanguageLabel">Bilingue</span>
        <select id="bilingual-language" name="bilingual_language">
          <option value="fr" selected>Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
        </select>
      </label>

      <label for="height">
        <span data-i18n="heightLabel">Hauteur</span>
        <input type="number" id="height" name="height" min="5" max="30" step="1" value="10" required>
      </label>

      <label for="difficulty">
        <span data-i18n="difficultyLabel">Difficulté</span>
        <select id="difficulty" name="difficulty">
          <option value="easy" selected data-i18n="difficultyEasy">Facile</option>
          <option value="medium" data-i18n="difficultyMedium">Moyenne</option>
          <option value="hard" data-i18n="difficultyHard">Difficile</option>
        </select>
      </label>

      <label for="black-enrichment">
        <span data-i18n="blackEnrichmentLabel">Taux noir</span>
        <span class="input-with-suffix">
          <input type="number" id="black-enrichment" name="black_enrichment_percent"
                 min="0" max="100" step="1" value="17">
          <span class="input-suffix">%</span>
        </span>
      </label>

      <label for="force-letters">
        <span data-i18n="forceLettersLabel">Graines</span>
        <span class="input-with-suffix">
          <input type="number" id="force-letters" name="force_letters_percent"
                 min="0" max="100" step="1" value="1">
          <span class="input-suffix">%</span>
        </span>
      </label>

      <label for="mode">
        <span data-i18n="modeLabel">Mode</span>
        <select id="mode" name="mode">
          <option value="interactive" data-i18n="modeInteractive">Interactif</option>
          <option value="flash" data-i18n="modeFlash">Flash</option>
          <option value="turbo" data-i18n="modeTurbo">Turbo</option>
          <option value="fast" data-i18n="modeFast">Rapide</option>
          <option value="medium" selected data-i18n="modeMedium">Moyen</option>
          <option value="ultra" data-i18n="modeUltra">Ultra</option>
        </select>
      </label>

      <!-- Seuil de similarité Qdrant minimal du glossaire thématique pour
           CETTE génération (voir backend/app.py's THEME_MIN_SCORE /
           GenerateRequest.theme_precision) — sans effet si "Thématique"
           est vide. Saisie libre, à la demande explicite de
           l'utilisateur ("configurer à la main"). -->
      <label for="theme-precision">
        <span data-i18n="themePrecisionLabel">Précision thématique</span>
        <!-- type="text" (pas "number") pour maîtriser le séparateur
             décimal : le point est forcé (une virgule saisie est
             normalisée en point par script.js, à la demande explicite de
             l'utilisateur) — un input "number" localisé accepterait/
             afficherait une virgule, source de confusion. -->
        <input type="text" id="theme-precision" name="theme_precision"
               inputmode="decimal" autocomplete="off" spellcheck="false"
               pattern="[0-9]*([.,][0-9]+)?" value="0.68"
               data-i18n-title="themePrecisionTitle">
      </label>

      <!-- Boutons d'action sur leur propre ligne, sous les combos d'options,
           à la demande explicite de l'utilisateur — #form-actions prend
           toute la largeur (flex-basis: 100%) donc passe à la ligne
           suivante dans le flex-wrap du formulaire. -->
      <div id="form-actions">
        <!-- Thématique optionnelle (liste de mots) — à côté de "Générer la
             grille", à la demande explicite de l'utilisateur. Non vide ->
             pré-recherche Qdrant des 5000 mots les plus proches, priorisés
             par le solveur (voir backend/app.py's THEME_PRESEARCH_LIMIT et
             crossword_gen.py's priority_words). -->
        <label id="theme-field" for="theme">
          <span data-i18n="themeLabel">Thématique</span>
          <input type="text" id="theme" name="theme" autocomplete="off"
                 data-i18n-placeholder="themePlaceholder"
                 data-i18n-title="themeTitle" />
        </label>
        <button type="submit" id="generate-btn" data-i18n="generateBtn">Générer la grille</button>
        <button type="button" id="attempt-preview-reveal-btn" class="toggle-btn"
                data-i18n="attemptPreviewRevealBtn">Voir</button>
        <button type="button" id="stop-btn" data-i18n="stopBtn" hidden>Stop</button>
        <button type="button" id="continue-btn" data-i18n="continueBtn" hidden>Continuer</button>
        <button type="button" id="check-btn" class="toggle-btn" data-i18n="checkBtn" hidden>Vérification</button>
        <button type="button" id="solution-btn" class="toggle-btn" data-i18n="solutionBtn" hidden>Solution</button>
        <button type="button" id="definitions-btn" class="toggle-btn" data-i18n="definitionsBtn" hidden>Définitions</button>
        <button type="button" id="recompute-btn" data-i18n="recomputeBtn" hidden>Recalculer</button>
        <button type="button" id="library-btn" data-i18n="libraryBtn">Bibliothèque</button>
        <button type="button" id="dictionary-btn" data-i18n="dictionaryBtn">Dictionnaire</button>
        <!-- "Créations" : liste les sessions "Interactif" en cours sauvegardées
             automatiquement dans GRID_WORK/ (voir plus bas et backend/
             grid_store.py) — à la demande explicite de l'utilisateur. -->
        <button type="button" id="interactive-work-btn" data-i18n="interactiveWorkBtn">Créations</button>
        <!-- Panneau d'administration Qdrant : rendu visible uniquement quand
             la page est ouverte en localhost (script.js,
             showQdrantAdminOnLocalhost) ; le proxy (frontend/server.py,
             _require_localhost) refuse aussi les routes /api/qdrant/admin/*
             pour tout client/Host non-loopback. -->
        <button type="button" id="qdrant-admin-btn" data-i18n="qdrantAdminBtn" hidden>Qdrant (admin)</button>
      </div>
    </form>

    <!-- Panneau "Actu Croisée" : toujours visible, jamais masqué par les
         sections centrales (#library/#attempt-preview/#result) qui se
         basculent entre elles — à la demande explicite de l'utilisateur
         ("la liste des flux RSS disparaît de l'interface quand quelque
         chose d'autre doit être affiché dans le panneau central"), donc
         placé comme sa propre section persistante, hors de ce groupe.
         Positionné juste en dessous des boutons de l'application, sur
         l'espace de fenêtre restant (voir #rss-panel dans style.css,
         `flex: 1` sur un `main` devenu colonne flexible), à la demande
         explicite de l'utilisateur. -->
    <section id="rss-panel">
      <div id="rss-panel-header">
        <h2 data-i18n="rssPanelTitle">Actu Croisée</h2>
        <select id="rss-language-filter" data-i18n-aria="rssLanguageFilterLabel">
          <option value="all" data-i18n="rssLanguageFilterAll">Toutes les langues</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
        </select>
      </div>
      <ul id="rss-list"></ul>
      <div id="rss-detail" hidden>
        <button type="button" id="rss-detail-close-btn" data-i18n="rssDetailCloseBtn">Fermer</button>
        <div id="rss-detail-body">
          <h3 id="rss-detail-title"></h3>
          <p id="rss-detail-meta"></p>
          <div id="rss-detail-content"></div>
        </div>
      </div>
    </section>

    <p id="status" role="status"></p>

    <section id="library" hidden>
      <div id="library-header">
        <p id="library-label" data-i18n="libraryLabel"></p>
        <select id="library-language-filter" data-i18n-aria="libraryLanguageFilterLabel">
          <option value="all" data-i18n="libraryLanguageFilterAll">Toutes les langues</option>
          <!-- Grilles bilingues (GRID_STORE/bilingual/, voir backend/
               grid_store.py), à la demande explicite de l'utilisateur —
               placée juste après "Toutes les langues" (position explicitement
               demandée) — ne matche aucune clé de WORDLISTS, filtré
               séparément côté Back (backend/app.py's _library_page) sur le
               champ `bilingual` de chaque grille plutôt que sur sa langue. -->
          <option value="bilingual" data-i18n="libraryLanguageFilterBilingual">Bilingue</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
        </select>
        <select id="library-seen-filter" data-i18n-aria="librarySeenFilterLabel">
          <option value="all" data-i18n="librarySeenFilterAll">Toutes les grilles</option>
          <option value="unseen" data-i18n="librarySeenFilterUnseen">Non vues</option>
          <option value="seen" data-i18n="librarySeenFilterSeen">Déjà vues</option>
          <!-- "Mes grilles" : filtre sur le pseudo de l'utilisateur
               courant (script.js envoie `pseudo` dans le corps POST,
               backend/app.py's _library_page filtre sur le champ
               `pseudo` de chaque grille) — à la demande explicite de
               l'utilisateur. -->
          <option value="mine" data-i18n="librarySeenFilterMine">Mes grilles</option>
        </select>
        <!-- Filtre de niveau, à la demande explicite de l'utilisateur.
             "Tous les niveaux" par défaut ; les libellés easy/medium/hard
             réutilisent les clés difficultyEasy/Medium/Hard existantes. -->
        <select id="library-difficulty-filter" data-i18n-aria="libraryDifficultyFilterLabel">
          <option value="all" data-i18n="libraryDifficultyFilterAll">Tous les niveaux</option>
          <option value="easy" data-i18n="difficultyEasy">Facile</option>
          <option value="medium" data-i18n="difficultyMedium">Moyenne</option>
          <option value="hard" data-i18n="difficultyHard">Difficile</option>
        </select>
        <button type="button" id="library-refresh-btn" class="nav-btn"
                data-i18n-aria="libraryRefreshBtn">↻</button>
        <button type="button" id="library-close-btn" class="nav-btn"
                data-i18n-aria="libraryCloseBtn">✕</button>
      </div>
      <div class="table-scroll">
        <table id="library-table">
          <thead>
            <tr>
              <th data-i18n="libraryColLanguage"></th>
              <th data-i18n="libraryColDate"></th>
              <th data-i18n="libraryColTitle"></th>
              <!-- Thématique saisie à la génération (champ `theme` du JSON,
                   vide si aucune) — à la demande explicite de l'utilisateur. -->
              <th data-i18n="libraryColTheme"></th>
              <th data-i18n="libraryColDifficulty"></th>
              <th data-i18n="libraryColSize"></th>
              <!-- Auteur de la grille (champ `pseudo` du JSON, vide si
                   non défini) — à la demande explicite de l'utilisateur. -->
              <th data-i18n="libraryColAuthor"></th>
              <!-- Lien partageable vers la grille (SHARE_BASE_URL + ?grid=<id>)
                   — à la demande explicite de l'utilisateur. -->
              <th data-i18n="libraryColLink"></th>
              <!-- Bouton icône ouvrant la grille en mode "Interactif" (crée
                   une nouvelle tâche GRID_WORK) — à la demande explicite de
                   l'utilisateur, à côté de "Jouer". En-tête sans libellé. -->
              <th data-i18n="libraryColInteractive"></th>
              <!-- Téléchargement PDF imprimable (grille vide + définitions +
                   titre, sans réponses) — dernière colonne, à la demande
                   explicite de l'utilisateur. -->
              <th data-i18n="libraryColPdf"></th>
            </tr>
          </thead>
          <tbody id="library-tbody"></tbody>
        </table>
      </div>
      <p id="library-empty" data-i18n="libraryEmpty" hidden></p>
      <div id="library-pagination" hidden>
        <button type="button" id="library-prev-btn" class="nav-btn"
                data-i18n-aria="libraryPrevBtn" disabled>◀</button>
        <span id="library-position"></span>
        <button type="button" id="library-next-btn" class="nav-btn"
                data-i18n-aria="libraryNextBtn" disabled>▶</button>
      </div>
    </section>

    <!-- Panneau "Créations" : sessions "Interactif" en cours, sauvegardées
         automatiquement dans GRID_WORK/ après chaque Suivant/Précédent — à
         la demande explicite de l'utilisateur. Ouvert soit par le bouton
         "Créations" ci-dessus, soit automatiquement au chargement de la
         page si l'utilisateur a des créations en cours (voir script.js's
         checkForSavedInteractiveWork()). Même groupe basculant que
         #library/#dictionary/#attempt-preview/#result. -->
    <section id="interactive-work" hidden>
      <div id="interactive-work-header">
        <p id="interactive-work-label" data-i18n="interactiveWorkLabel"></p>
        <button type="button" id="interactive-work-refresh-btn" class="nav-btn"
                data-i18n-aria="interactiveWorkRefreshBtn">↻</button>
        <button type="button" id="interactive-work-close-btn" class="nav-btn"
                data-i18n-aria="interactiveWorkCloseBtn">✕</button>
      </div>
      <div class="table-scroll">
        <table id="interactive-work-table">
          <thead>
            <tr>
              <th data-i18n="interactiveWorkColTitle"></th>
              <th data-i18n="interactiveWorkColLanguage"></th>
              <th data-i18n="interactiveWorkColDifficulty"></th>
              <th data-i18n="interactiveWorkColSize"></th>
              <th data-i18n="interactiveWorkColUpdated"></th>
              <th data-i18n="interactiveWorkColDelete"></th>
            </tr>
          </thead>
          <tbody id="interactive-work-tbody"></tbody>
        </table>
      </div>
      <p id="interactive-work-empty" data-i18n="interactiveWorkEmpty" hidden></p>
    </section>

    <!-- Panneau "Dictionnaire" : recherche accent/casse-insensible dans
         <lang>_glosses.jsonl, liste les mots de la même racine. À la
         demande explicite de l'utilisateur. Même groupe basculant que
         #library / #attempt-preview / #result. -->
    <section id="dictionary" hidden>
      <div id="dictionary-header">
        <form id="dictionary-form">
          <select id="dictionary-language" data-i18n-aria="dictionaryLanguageLabel">
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
          <option value="pt">Português</option>
          </select>
          <input type="text" id="dictionary-input" autocomplete="off"
                 data-i18n-placeholder="dictionaryInputPlaceholder">
          <button type="submit" id="dictionary-search-btn"
                  data-i18n="dictionarySearchBtn">Chercher</button>
          <!-- "Synonymes" : recherche Qdrant directe sur le mot/l'expression
               saisi(e), SANS appel au LLM pour étendre la recherche
               (contrairement à "Thématique") — à la demande explicite de
               l'utilisateur. Placé entre "Chercher" et "Thématique", à la
               demande explicite de l'utilisateur. -->
          <button type="button" id="dictionary-synonyms-btn"
                  data-i18n="dictionarySynonymsBtn">Synonymes</button>
          <button type="button" id="dictionary-similar-btn"
                  data-i18n="dictionarySimilarBtn">Thématique</button>
          <!-- Demande au LLM jusqu'à 10 définitions indépendantes de
               l'expression saisie (comme pour un mot de grille — voir
               backend/clues.py, LLMClueGenerator.generate_definitions),
               à la demande explicite de l'utilisateur. -->
          <button type="button" id="dictionary-define-btn"
                  data-i18n="dictionaryDefineBtn">Définir</button>
          <button type="button" id="dictionary-clear-btn" class="nav-btn"
                  data-i18n="dictionaryClearBtn">Effacer</button>
          <!-- Ouvre Perplexity, dans un nouvel onglet, avec une requête de
               définition ("Définir le mot <langue> : <mot>", adaptée à la
               langue du sélecteur #dictionary-language) portant sur le mot
               saisi dans #dictionary-input — à la demande explicite de
               l'utilisateur. Texte "Perplexity" non traduit (nom propre du
               service, comme "Falcon Auto Bot" ailleurs dans ce fichier) ;
               icône "lien externe" en SVG inline (aucune police/lib
               d'icônes externe dans ce projet) signalant l'ouverture hors
               site. -->
          <button type="button" id="dictionary-perplexity-btn" class="nav-btn"
                  data-i18n-aria="dictionaryPerplexityTitle"
                  data-i18n-title="dictionaryPerplexityTitle">Perplexity
            <svg class="external-link-icon" viewBox="0 0 24 24" width="13" height="13"
                 aria-hidden="true" focusable="false">
              <path d="M9 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"
                    fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 4h6v6M20 4l-9 9"
                    fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <button type="button" id="dictionary-close-btn" class="nav-btn"
                data-i18n-aria="dictionaryCloseBtn">✕</button>
      </div>
      <div id="dictionary-results"></div>
    </section>

    <!-- Panneau "Qdrant (admin)" : état lecture seule de la base vectorielle
         + deux actions rapides (recréer la collection, vider une langue) +
         lien vers le tableau de bord natif de Qdrant. Bouton masqué hors
         localhost (script.js) ; routes proxy refusées hors loopback
         (frontend/server.py). Même groupe basculant que #library /
         #dictionary / #attempt-preview / #result. -->
    <section id="qdrant-admin" hidden>
      <div id="qdrant-admin-header">
        <p id="qdrant-admin-label" data-i18n="qdrantAdminTitle">Qdrant — administration</p>
        <button type="button" id="qdrant-admin-refresh-btn" class="nav-btn"
                data-i18n="qdrantAdminRefreshBtn">Rafraîchir</button>
        <button type="button" id="qdrant-admin-close-btn" class="nav-btn"
                data-i18n-aria="qdrantAdminCloseBtn">✕</button>
      </div>
      <div id="qdrant-admin-body"></div>
    </section>

    <section id="attempt-preview" hidden>
      <div id="attempt-preview-header">
        <p id="attempt-preview-label" data-i18n="attemptPreviewLabel"></p>
        <button type="button" id="attempt-preview-first-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewFirstBtn" disabled>⏮</button>
        <button type="button" id="attempt-preview-prev-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewPrevBtn" disabled>◀</button>
        <span id="attempt-preview-position"></span>
        <button type="button" id="attempt-preview-next-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewNextBtn" disabled>▶</button>
        <button type="button" id="attempt-preview-last-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewLastBtn" disabled>⏭</button>
      </div>
      <p id="attempt-preview-status"></p>
      <div id="attempt-preview-grids"></div>
      <div id="word-verification-wrap" hidden>
        <p id="word-verification-title" data-i18n="wordVerificationTitle"></p>
        <div class="table-scroll">
          <table id="word-verification-table">
            <thead>
              <tr>
                <th data-i18n="wordVerificationColPosition"></th>
                <th data-i18n="wordVerificationColWordlist"></th>
                <th data-i18n="wordVerificationColRoot"></th>
              </tr>
            </thead>
            <tbody id="word-verification-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="result" hidden>
      <!-- #grid-timer : compteur de temps (s'incrémente toutes les
           secondes, script.js's startGridTimer()), à la demande explicite
           de l'utilisateur. Historique de placement : d'abord à gauche du
           titre (en ligne), puis "aligné à droite de l'écran" (position
           fixe, coin de la fenêtre), puis — signalé "trop haut, pas assez
           lié au titre" — de retour en ligne ici, sur la même ligne que
           #grid-title mais alignée à droite de cette ligne (voir
           #grid-title-row ci-dessous, margin-left: auto sur #grid-timer).
           Masqué par défaut (mode "Interactif", ou avant qu'une grille
           jouable existe) — voir hideInteractivePanel()/startGridTimer(). -->
      <div id="grid-title-row">
        <h2 id="grid-title" hidden><span id="grid-title-text"></span><span id="grid-difficulty" hidden></span></h2>
        <span id="grid-timer" hidden></span>
      </div>
      <p id="stats"></p>
      <p id="generation-times">
        <span id="generation-times-text"></span>
        <button type="button" id="generation-times-prev-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewPrevBtn" disabled>◀</button>
        <span id="generation-times-position"></span>
        <button type="button" id="generation-times-next-btn" class="nav-btn"
                data-i18n-aria="attemptPreviewNextBtn" disabled>▶</button>
      </p>
      <div id="board">
        <div id="clues">
          <h2 data-i18n="acrossHeading">Horizontalement</h2>
          <div id="clues-across" class="clue-lines"></div>
        </div>
        <div id="grid-column">
          <!-- "Interactif" only (script.js's enterInteractiveMode() reveals
               them and adds .interactive-flank to #grid-column): flanking
               the grid on each side, vertically centered against it — moved
               here from the play-mode-shaped #interactive-nav row that used
               to sit inside #interactive-controls, at the user's explicit
               request. Hidden by default so an ordinary generated grid
               never shows them. -->
          <button type="button" id="interactive-prev-btn" class="interactive-flank-btn" hidden
                  data-i18n="interactivePrevBtn" disabled>Précédent</button>
          <div id="grid"></div>
          <button type="button" id="interactive-next-btn" class="interactive-flank-btn" hidden
                  data-i18n="interactiveNextBtn">Suivant</button>
          <!-- Sélecteur de sens dupliqué du clavier virtuel, à droite de
               la zone de définition permanente (jamais masquée par le
               bouton "définitions", contrairement à #clues/#down-clues-
               section) — à la demande explicite de l'utilisateur.
               Mêmes boutons .toggle-btn, même comportement (voir
               script.js's setActiveDirection()) — les deux exemplaires
               restent en permanence synchronisés l'un avec l'autre, avec
               SHIFT/CAPSLOCK, et avec le survol de la grille. -->
          <div id="hover-definition-row">
            <p id="hover-definition"></p>
            <div id="clues-direction-col">
              <button type="button" id="clues-direction-across-btn" class="toggle-btn active"
                      data-i18n-aria="virtualKeyboardAcrossBtn">→</button>
              <button type="button" id="clues-direction-down-btn" class="toggle-btn"
                      data-i18n-aria="virtualKeyboardDownBtn">↓</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Contrôles du mode "Interactif" (voir script.js) — insérés dans
           #result pour réutiliser #grid/renderGrid() ; masqués pour une
           génération normale. -->
      <div id="interactive-controls" hidden>
        <span id="interactive-message" role="status"></span>
        <div id="interactive-arrows">
          <!-- "Mots" : liste les mots réels du dictionnaire compatibles
               avec l'emplacement sélectionné (voir POST /api/interactive/
               candidates) — à la demande explicite de l'utilisateur. Le
               résultat s'affiche dans #interactive-words-results,
               juste sous le champ de définition. Placé à gauche des
               flèches à la demande explicite de l'utilisateur. -->
          <button type="button" id="interactive-words-btn"
                  data-i18n="interactiveWordsBtn">Mots</button>
          <button type="button" id="interactive-dir-across-btn" class="toggle-btn active"
                  data-i18n-aria="virtualKeyboardAcrossBtn">→</button>
          <button type="button" id="interactive-dir-down-btn" class="toggle-btn"
                  data-i18n-aria="virtualKeyboardDownBtn">↓</button>
          <!-- "Nettoyer" : déclenche le nettoyage complet des zones
               impossibles (retrait des mots croisants / case noire, comme
               la génération automatique), à la demande explicite de
               l'utilisateur — placé à droite des flèches. -->
          <button type="button" id="interactive-clean-btn"
                  data-i18n="interactiveCleanBtn">Nettoyer</button>
          <!-- "Nettoyer (+noires)" : nettoyage approfondi — en plus des
               zones impossibles, essaie de retirer chaque case noire de
               la grille elle-même, pas seulement celles liées à un
               emplacement impossible — à la demande explicite de
               l'utilisateur. -->
          <button type="button" id="interactive-clean-deep-btn"
                  data-i18n="interactiveCleanDeepBtn">Nettoyer (+noires)</button>
          <!-- "Vérifier" déplacé ici, à côté de "Nettoyer", à la demande
               explicite de l'utilisateur (hors de #interactive-definition-
               row, qui ne garde plus que le champ de définition et
               "Proposer"). -->
          <button type="button" id="interactive-verify-btn"
                  data-i18n="interactiveVerifyBtn">Vérifier</button>
          <!-- "Définitions" : génère automatiquement une définition pour
               chaque mot entièrement rempli et valide qui n'en a pas
               encore — à la demande explicite de l'utilisateur, à droite
               de "Vérifier". Réutilise POST /api/interactive/verify (comme
               "Vérifier", pour écarter les mots absents du dictionnaire)
               puis GET /api/dictionary/define (comme "Proposer") pour
               chacun, en gardant la première proposition. -->
          <button type="button" id="interactive-definitions-btn"
                  data-i18n="interactiveDefinitionsBtn">Définitions</button>
        </div>
        <div id="interactive-definition-row">
          <input type="text" id="interactive-definition-input" autocomplete="off"
                 data-i18n-placeholder="interactiveDefinitionPlaceholder">
          <button type="button" id="interactive-propose-btn"
                  data-i18n="interactiveProposeBtn">Proposer une définition</button>
        </div>
        <!-- "Vérifier" : rapport détaillé, un mot par ligne, des problèmes
             trouvés sur la grille entière — à la demande explicite de
             l'utilisateur, en plus du message-résumé sur
             #interactive-message. Voir renderInteractiveVerifyReport(). -->
        <div id="interactive-verify-report" hidden></div>
        <div id="interactive-words-results" hidden></div>
        <div id="interactive-propose-results" hidden></div>
        <div id="interactive-title-row" hidden>
          <label for="interactive-title-input" data-i18n="interactiveTitleLabel">Titre</label>
          <input type="text" id="interactive-title-input" autocomplete="off">
          <button type="button" id="interactive-title-propose-btn"
                  data-i18n="interactiveTitleProposeBtn">Proposer un titre</button>
        </div>
        <!-- 10 propositions de titre affichées ici, comme
             #interactive-propose-results (une ligne par proposition,
             cliquable pour remplir #interactive-title-input) — à la
             demande explicite de l'utilisateur : "Le bouton 'Proposer un
             titre' doit générer 10 propositions affichées en dessous
             (comme 'Proposer une définition')." Voir
             renderInteractiveTitleProposals(). -->
        <div id="interactive-title-propose-results" hidden></div>
        <div id="interactive-save-row">
          <!-- "Sauvegarder" : enregistre l'état complet de la grille dans
               GRID_WORK (brouillon "Créations") SANS la publier — à la
               demande explicite de l'utilisateur, à gauche de "Publier".
               Toujours visible en mode Interactif ; "Publier"
               (#interactive-save-btn) n'apparaît qu'une fois la grille
               terminée. -->
          <button type="button" id="interactive-draft-save-btn"
                  data-i18n="interactiveSaveBtn">Sauvegarder</button>
          <button type="button" id="interactive-save-btn" hidden
                  data-i18n="interactivePublishBtn">Publier</button>
        </div>
        <p id="interactive-save-result"></p>
      </div>
      <div id="down-clues-section">
        <h2 data-i18n="downHeading">Verticalement</h2>
        <div id="clues-down" class="clue-lines clue-lines-columns"></div>
      </div>
    </section>
  </main>

  <div id="chatbot">
    <div id="chatbot-header">
      <img src="logo.svg" alt="" id="chatbot-icon">
      <span id="chatbot-title">David FALCON</span>
      <button type="button" id="chatbot-toggle-btn" class="nav-btn"
              data-i18n-aria="chatbotToggleBtn">–</button>
    </div>
    <div id="chatbot-body">
      <div id="chatbot-messages"></div>
      <form id="chatbot-form">
        <input type="text" id="chatbot-input" data-i18n-placeholder="chatbotInputPlaceholder"
               autocomplete="off">
        <button type="submit" id="chatbot-send-btn" class="chatbot-icon-btn"
                data-i18n-aria="chatbotSendBtn" data-i18n-title="chatbotSendBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M2.5 12 21 4l-7 17-3.2-6.8L2.5 12z" fill="currentColor"></path>
          </svg>
        </button>
        <button type="button" id="chatbot-reset-btn" class="chatbot-icon-btn"
                data-i18n-aria="chatbotResetBtn" data-i18n-title="chatbotResetBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M12 5V2L7.5 6.5 12 11V7.5a4.5 4.5 0 1 1-4.5 4.5H5a7 7 0 1 0 7-7z" fill="currentColor"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Clavier virtuel, à la demande explicite de l'utilisateur : "En bas
       à gauche de l'interface, au même niveau que le ChatBot, ajouter un
       bouton permettant de monter/cacher un clavier virtuel." Même
       structure que #chatbot ci-dessus (en-tête toujours visible +
       bouton replier/déplier, corps qui se cache) mais repliée par
       défaut — contrairement au Bot, ouvert par défaut, un clavier
       virtuel n'est utile qu'à une minorité de joueurs (écran tactile,
       absence de clavier physique pratique), pas la peine de l'imposer
       ouvert à tout le monde. -->
  <div id="virtual-keyboard" class="virtual-keyboard-collapsed">
    <!-- Plus de bandeau de titre ("Clavier virtuel") ni de rangée dédiée
         aux flèches de direction, à la demande explicite de
         l'utilisateur : "Ne pas mettre un titre 'Clavier virtuel' qui
         prend aussi de la place en hauteur. Mettre simplement l'icône de
         fermeture en petit au dessus des flèches" + "mettre les flèches
         de direction sur la droite des lettres, pour gagner en hauteur."
         Le bouton replier/déplier vit maintenant seul, directement
         au-dessus de la colonne de flèches (#virtual-keyboard-side
         ci-dessous), plutôt que dans un en-tête pleine largeur — visible
         aussi bien replié (seule icône affichée, voir style.css) que
         déplié. -->
    <button type="button" id="virtual-keyboard-toggle-btn" class="nav-btn"
            data-i18n-aria="virtualKeyboardToggleBtn">⌨</button>
    <div id="virtual-keyboard-body">
      <!-- Les 26 lettres, en majuscules, dans l'ordre alphabétique
           naturel sur 2 lignes (voir script.js's buildVirtualKeyboard()
           pour la génération réelle des boutons — un rang de 13 lettres
           chacun, A-M puis N-Z). -->
      <div id="virtual-keyboard-rows"></div>
      <!-- Bascule du sens de saisie, à la demande explicite de
           l'utilisateur : "une flèche vers le bas pour configurer le sens
           vertical (similaire à SHIFT/CAPS LOCK) et une flèche vers la
           droite pour configurer le sens horizontalement." Deux boutons
           mutuellement exclusifs (.toggle-btn, même convention que
           Solution/Vérification) plutôt qu'un vrai Shift (maintenu) —
           un clic bascule un mode persistant, plus proche d'un
           comportement CAPS LOCK que SHIFT pour un bouton cliqué, comme
           le nom même de la demande le suggère. Placées à droite des
           lettres (colonne, pas rangée) plutôt qu'au-dessus, pour gagner
           en hauteur. -->
      <div id="virtual-keyboard-direction-col">
        <button type="button" id="virtual-keyboard-across-btn" class="toggle-btn active"
                data-i18n-aria="virtualKeyboardAcrossBtn">→</button>
        <button type="button" id="virtual-keyboard-down-btn" class="toggle-btn"
                data-i18n-aria="virtualKeyboardDownBtn">↓</button>
      </div>
    </div>
  </div>

  <!-- Panneau d'accueil, à la demande explicite de l'utilisateur : au
       premier affichage (aucun cookie de préférences), on détecte la
       langue du navigateur et on affiche ce formulaire en overlay. Il ne
       peut se fermer qu'en cliquant "Accepter" (aucun bouton de
       fermeture, pas de <dialog> — donc ni ESC ni clic sur le fond ne le
       ferment). Changer le sélecteur de langue reconfigure tout de suite
       le formulaire ET la page dans cette langue (les deux sélecteurs de
       langue, celui-ci et #language, restent synchronisés). Le pseudo est
       facultatif (moins de 15 lettres). Rouvert plus tard via le bouton
       #user-pseudo de l'en-tête. -->
  <div id="welcome-overlay" role="dialog" aria-modal="true"
       aria-labelledby="welcome-title" hidden>
    <form id="welcome-form">
      <h2 id="welcome-title" data-i18n="welcomeTitle">Bienvenue</h2>
      <label for="welcome-language">
        <span data-i18n="welcomeLanguageLabel">Langue</span>
        <select id="welcome-language">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
        </select>
      </label>
      <label for="welcome-pseudo">
        <span data-i18n="welcomePseudoLabel">Pseudo</span>
        <!-- Requis : à la demande explicite de l'utilisateur, le panneau
             ne se ferme pas tant que le pseudo est vide (validation
             native `required`, + garde JS contre les espaces seuls). -->
        <input type="text" id="welcome-pseudo" maxlength="15" required
               autocomplete="nickname" autocapitalize="off"
               data-i18n-placeholder="welcomePseudoPlaceholder">
      </label>
      <p id="welcome-cookie-notice" data-i18n="welcomeCookieNotice"></p>
      <button type="submit" id="welcome-accept-btn"
              data-i18n="welcomeAcceptBtn">Accepter</button>
    </form>
  </div>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
